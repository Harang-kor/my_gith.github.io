<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>야추 모바일 2D 완성</title>

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(135deg,#4facfe,#00f2fe);
  text-align:center;
  color:white;
}

.card {
  background:white;
  color:black;
  margin:15px;
  padding:15px;
  border-radius:15px;
}

.dice-container {
  display:flex;
  justify-content:center;
  gap:12px;
  margin:20px;
}

.dice {
  width:60px;
  height:60px;
  background:white;
  border-radius:12px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  padding:6px;
  cursor:pointer;
}

.held { outline:3px solid gold; }

.dot {
  width:8px;height:8px;background:black;border-radius:50%;
  justify-self:center;align-self:center;
}

/* 위치 */
.tl{grid-area:1/1;} .tc{grid-area:1/2;} .tr{grid-area:1/3;}
.ml{grid-area:2/1;} .mc{grid-area:2/2;} .mr{grid-area:2/3;}
.bl{grid-area:3/1;} .bc{grid-area:3/2;} .br{grid-area:3/3;}

button {
  padding:12px 25px;
  margin:5px;
  border:none;
  border-radius:20px;
  background:#ff6a00;
  color:white;
}

table { width:100%; border-collapse:collapse; }
td { padding:10px; border-bottom:1px solid #ddd; }
.used { background:#ccc; }
</style>
</head>

<body>

<h2>🎲 야추 모바일</h2>
<p>남은 횟수: <span id="rolls">3</span></p>

<div class="dice-container" id="diceContainer"></div>

<button onclick="rollDice()">🎲 굴리기</button>
<button onclick="resetGame()">🔄 리셋</button>

<div class="card">
<table id="scoreTable">

<tr><td onclick="selectScore(this,'ones')">1</td><td></td></tr>
<tr><td onclick="selectScore(this,'twos')">2</td><td></td></tr>
<tr><td onclick="selectScore(this,'threes')">3</td><td></td></tr>
<tr><td onclick="selectScore(this,'fours')">4</td><td></td></tr>
<tr><td onclick="selectScore(this,'fives')">5</td><td></td></tr>
<tr><td onclick="selectScore(this,'sixes')">6</td><td></td></tr>

<tr><td onclick="selectScore(this,'three')">3개</td><td></td></tr>
<tr><td onclick="selectScore(this,'four')">4개</td><td></td></tr>
<tr><td onclick="selectScore(this,'full')">풀하우스</td><td></td></tr>
<tr><td onclick="selectScore(this,'small')">스몰</td><td></td></tr>
<tr><td onclick="selectScore(this,'large')">라지</td><td></td></tr>
<tr><td onclick="selectScore(this,'yahtzee')">야추</td><td></td></tr>
<tr><td onclick="selectScore(this,'chance')">찬스</td><td></td></tr>

<tr><td>상단보너스</td><td id="bonus">0</td></tr>
<tr><td>야추보너스</td><td id="yahtzeeBonus">0</td></tr>
<tr><td>총점</td><td id="total">0</td></tr>

</table>
</div>

<script>
let diceValues=[1,1,1,1,1];
let held=[false,false,false,false,false];
let rollsLeft=3;

let used={};
let hasRolled=false;
let turnUsed=false;

let yahtzeeScored=false;
let yahtzeeBonus=0;

const dotMap={
1:["mc"],2:["tl","br"],3:["tl","mc","br"],
4:["tl","tr","bl","br"],
5:["tl","tr","mc","bl","br"],
6:["tl","tr","ml","mr","bl","br"]
};

function renderDice(){
  const c=document.getElementById("diceContainer");
  c.innerHTML="";

  diceValues.forEach((v,i)=>{
    const d=document.createElement("div");
    d.className="dice";

    if(held[i]) d.classList.add("held");

    d.onclick=()=>{
      held[i]=!held[i];
      renderDice();
    };

    dotMap[v].forEach(p=>{
      const dot=document.createElement("div");
      dot.className="dot "+p;
      d.appendChild(dot);
    });

    c.appendChild(d);
  });
}

function rollDice(){
  if(rollsLeft<=0) return alert("더 못 굴림!");

  hasRolled=true;

  for(let i=0;i<5;i++){
    if(!held[i]){
      diceValues[i]=Math.floor(Math.random()*6)+1;
    }
  }

  const counts=getCounts();

  // 🎯 야추 보너스
  if(Math.max(...counts)===5 && yahtzeeScored){
    yahtzeeBonus+=100;
    document.getElementById("yahtzeeBonus").textContent=yahtzeeBonus;
  }

  rollsLeft--;
  document.getElementById("rolls").textContent=rollsLeft;

  renderDice();
}

function getCounts(){
  const counts=[0,0,0,0,0,0,0];
  diceValues.forEach(v=>counts[v]++);
  return counts;
}

function sum(){ return diceValues.reduce((a,b)=>a+b,0); }
function count(n){ return diceValues.filter(v=>v===n).length; }

function hasStraight(len){
  const u=[...new Set(diceValues)].sort();
  let c=1;
  for(let i=1;i<u.length;i++){
    if(u[i]===u[i-1]+1){
      c++;
      if(c>=len) return true;
    } else c=1;
  }
  return false;
}

function selectScore(cell,type){
  if(!hasRolled) return alert("먼저 굴려!");
  if(turnUsed) return alert("이미 선택함!");
  if(used[type]) return;

  let score=0;
  const counts=getCounts();

  switch(type){
    case "ones": score=count(1); break;
    case "twos": score=count(2)*2; break;
    case "threes": score=count(3)*3; break;
    case "fours": score=count(4)*4; break;
    case "fives": score=count(5)*5; break;
    case "sixes": score=count(6)*6; break;

    case "three": if(Math.max(...counts)>=3) score=sum(); break;
    case "four": if(Math.max(...counts)>=4) score=sum(); break;
    case "full": if(counts.includes(3)&&counts.includes(2)) score=25; break;
    case "small": if(hasStraight(4)) score=30; break;
    case "large": if(hasStraight(5)) score=40; break;

    case "yahtzee":
      if(Math.max(...counts)===5){
        score=50;
        yahtzeeScored=true;
      }
      break;

    case "chance": score=sum(); break;
  }

  cell.nextElementSibling.textContent=score;
  cell.classList.add("used");

  used[type]=true;
  turnUsed=true;

  updateTotal();
  resetTurn();
}

function updateTotal(){
  let total=0;
  let upper=0;

  document.querySelectorAll("#scoreTable tr").forEach((row,i)=>{
    const val=row.children[1].textContent;
    if(val){
      if(i<6) upper+=Number(val);
      if(i<13) total+=Number(val);
    }
  });

  const bonus=(upper>=63)?35:0;
  document.getElementById("bonus").textContent=bonus;

  total+=bonus+yahtzeeBonus;
  document.getElementById("total").textContent=total;
}

function resetTurn(){
  rollsLeft=3;
  hasRolled=false;
  turnUsed=false;
  held=[false,false,false,false,false];
  document.getElementById("rolls").textContent=rollsLeft;
}

function resetGame(){
  location.reload();
}

renderDice();
</script>

</body>
</html>
